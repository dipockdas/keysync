name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Run tests
        run: go test ./internal/store/... ./internal/config/... ./internal/crypto/... ./internal/commands/... -race -count=1

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: make release VERSION="${{ github.ref_name }}"

      - name: Create release archive
        shell: bash
        run: |
          cd dist
          for dir in keysync_*; do
            os_arch="${dir#keysync_}"
            if [[ "$os_arch" == windows_* ]]; then
              (cd "$dir" && zip -r "../keysync_${os_arch}.zip" .)
            else
              (cd "$dir" && tar czf "../keysync_${os_arch}.tar.gz" .)
            fi
          done

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum keysync_*.tar.gz keysync_*.zip > checksums.txt 2>/dev/null || true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          NOTES="## keysync ${GITHUB_REF_NAME}

          Build artifacts:
          "

          for f in dist/keysync_*.tar.gz dist/keysync_*.zip dist/checksums.txt; do
            if [ -f "$f" ]; then
              NOTES="${NOTES}
          - \`$(basename $f)\`"
            fi
          done

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTES" \
            --draft \
            dist/keysync_*.tar.gz dist/keysync_*.zip dist/checksums.txt
